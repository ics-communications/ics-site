<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<title>ICS — YouTube channel banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 2560x1440, YouTube's recommended banner size.
     TV shows the whole canvas; desktop crops to the full-width band
     y 508–931; phones crop further to the centre 1546x423 safe area.
     Everything that must be read lives inside .safe.
     Render: node <render script> youtube-banner.html .canvas youtube-banner.png */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --wine:        #9B0D24;
    --wine-deep:   #7A0A1C;
    --wine-mid:    #BE0B28;
    --accent:      #A85A32;
    --accent-light:#C87A52;
    --cream:       #FDFBF7;
    --text-on-dark:#E8C2C2;
    --serif: 'Libre Baskerville', Georgia, serif;
    --sans:  'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    background: #6b6b6b;            /* preview gutter only; not captured */
    padding: 40px;
    font-family: var(--sans);
  }

  .canvas {
    position: relative;
    width: 2560px;
    height: 1440px;
    overflow: hidden;
    background: var(--wine-deep);
  }

  /* The site hero, scaled up: desaturated seminar photo under a wine veil. */
  .photo {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 42%;
    filter: saturate(0.25) brightness(0.7);
  }

  /* Heavier on the left where the type sits, lifting toward the right so the
     seminar still reads; warm copper and red washes as on the site. */
  .veil {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 14% 82%, rgba(168,90,50,0.20) 0%, transparent 50%),
      radial-gradient(ellipse at 88% 12%, rgba(190,11,40,0.30) 0%, transparent 52%),
      linear-gradient(90deg, rgba(122,10,28,0.97) 0%, rgba(122,10,28,0.93) 46%, rgba(122,10,28,0.80) 72%, rgba(122,10,28,0.62) 100%);
  }

  /* Oversized dove mark bleeding off the right, as texture. */
  .watermark {
    position: absolute;
    top: 140px;
    right: -1180px;
    width: 1800px;
    opacity: 0.08;
  }

  .rule {
    position: absolute;
    left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent-light) 38%, rgba(200,122,82,0) 82%);
  }
  .rule--top    { top: 0; height: 12px; }
  /* Hairlines framing the band every device shows. */
  .rule--band-top { top: 508px; height: 3px; opacity: 0.85; }
  .rule--band-bot { top: 928px; height: 3px; opacity: 0.85;
    background: linear-gradient(270deg, var(--accent), var(--accent-light) 38%, rgba(200,122,82,0) 82%); }

  /* ── Safe area: 1546x423 centred ─────────────────────── */
  .safe {
    position: absolute;
    left: 507px;
    top: 508px;
    width: 1546px;
    height: 423px;
    display: flex;
    align-items: center;
    padding: 0 40px;
  }

  .mark {
    width: 330px;
    flex-shrink: 0;
    display: block;
  }

  .divider {
    width: 2px;
    align-self: stretch;
    margin: 78px 64px;
    background: linear-gradient(180deg, rgba(200,122,82,0), var(--accent-light) 25%, var(--accent-light) 75%, rgba(200,122,82,0));
  }

  .words { min-width: 0; }

  .name {
    font-family: var(--serif);
    font-weight: 700;
    font-size: 86px;
    line-height: 1.06;
    letter-spacing: -0.01em;
    color: var(--cream);
  }

  .tagline {
    margin-top: 18px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 46px;
    line-height: 1.2;
    color: var(--accent-light);
  }

  .meta {
    margin-top: 30px;
    font-size: 27px;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--text-on-dark);
  }
  .meta span { color: var(--accent-light); padding: 0 0.55em; }
</style>
</head>
<body>
  <div class="canvas">
    <img class="photo" src="../images/hero.jpg" alt="">
    <div class="veil"></div>
    <img class="watermark" src="../../SVG-Logos/ICS_logo_white%20(1).svg" alt="">

    <div class="rule rule--top"></div>
    <div class="rule rule--band-top"></div>
    <div class="rule rule--band-bot"></div>

    <div class="safe">
      <img class="mark" src="../../SVG-Logos/ICS_logo_white%20(1).svg" alt="ICS">
      <div class="divider"></div>
      <div class="words">
        <h1 class="name">Institute for<br>Christian Studies</h1>
        <p class="tagline">Where faith meets rigorous scholarship</p>
        <p class="meta">Graduate school<span>·</span>Toronto &amp; Online<span>·</span>icscanada.edu</p>
      </div>
    </div>
  </div>
</body>
</html>
