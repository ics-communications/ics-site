<!DOCTYPE html>
<html lang="en-CA">
<head>
<meta charset="UTF-8">
<title>Academic Registrar — 4:5 social tile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* 1080x1350 = 4:5, the Instagram/Facebook portrait feed size.
     Render with: node .render/render.mjs  (targets .canvas at 2x) */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --wine:        #9B0D24;
    --wine-deep:   #7A0A1C;
    --wine-mid:    #BE0B28;
    --accent:      #A85A32;
    --accent-light:#C87A52;
    --cream:       #FDFBF7;
    --cream-warm:  #F9F5ED;
    --text-dark:   #2E1318;
    --text-body:   #3A3330;
    --text-muted:  #857E78;
    --text-on-dark:#E8C2C2;
    --serif: 'Libre Baskerville', Georgia, serif;
    --sans:  'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    background: #6b6b6b;            /* preview gutter only; not captured */
    display: flex;
    justify-content: center;
    padding: 40px;
    font-family: var(--sans);
  }

  .canvas {
    position: relative;
    width: 1080px;
    height: 1350px;
    flex-shrink: 0;                 /* the preview flexbox must never squeeze the canvas */
    overflow: hidden;
    background: var(--wine-deep);
    display: flex;
    flex-direction: column;
  }

  /* Brand light: the same radial washes the site hero uses. */
  .canvas::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      radial-gradient(ellipse at 12% 88%, rgba(168,90,50,0.22) 0%, transparent 55%),
      radial-gradient(ellipse at 88% 6%,  rgba(190,11,40,0.35) 0%, transparent 58%);
    pointer-events: none;
  }

  /* Oversized dove mark bleeding off the right edge, as texture. */
  /* Mark-only lockup (no wordmark) so the ghost reads as texture, not as
     a second, half-legible logo. */
  .watermark {
    position: absolute;
    top: 300px;
    right: -215px;
    width: 900px;
    opacity: 0.06;
    pointer-events: none;
  }

  .rule-top {
    height: 10px;
    flex-shrink: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-light) 38%, rgba(200,122,82,0) 82%);
    position: relative;
    z-index: 2;
  }

  /* ── Upper field ─────────────────────────────────────── */
  .top {
    position: relative;
    z-index: 2;
    flex: 1;
    padding: 72px 84px 60px;
    display: flex;
    flex-direction: column;
  }

  .logo { width: 152px; display: block; }

  .eyebrow {
    margin-top: 62px;
    font-size: 40px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent-light);
  }

  .title {
    font-family: var(--serif);
    font-size: 104px;
    font-weight: 700;
    line-height: 1.04;
    color: var(--cream);
    margin-top: 26px;
    letter-spacing: -0.01em;
  }

  .title em {
    display: block;
    font-style: italic;
    font-weight: 400;
    color: var(--accent-light);
    font-size: 96px;
  }

  .lede {
    margin-top: 30px;
    max-width: 670px;
    font-size: 28px;
    font-weight: 300;
    line-height: 1.55;
    color: var(--text-on-dark);
  }

  .facts {
    margin-top: auto;               /* anchor the chips to the foot of the wine field */
    padding-top: 52px;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
  }

  .fact {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--cream);
    background: rgba(255,255,255,0.09);
    border: 1px solid rgba(255,255,255,0.22);
    padding: 14px 22px;
  }

  /* ── Lower panel ─────────────────────────────────────── */
  .panel {
    position: relative;
    z-index: 2;
    flex-shrink: 0;
    background: var(--cream);
    border-top: 8px solid var(--accent);
    padding: 54px 84px 58px;
  }

  .panel__label {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--accent);
  }

  .panel__line {
    margin-top: 18px;
    font-family: var(--serif);
    font-size: 34px;
    font-weight: 700;
    line-height: 1.35;
    color: var(--wine);
  }

  .panel__meta {
    margin-top: 16px;
    font-size: 26px;
    line-height: 1.55;
    color: var(--text-body);
  }

  .panel__meta strong {
    font-weight: 600;
    color: var(--text-dark);
  }

  .panel__foot {
    margin-top: 30px;
    padding-top: 26px;
    border-top: 1px solid rgba(155,13,36,0.14);
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 24px;
  }

  .panel__url {
    font-size: 25px;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--wine);
  }

  .panel__note {
    font-size: 22px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
</style>
</head>
